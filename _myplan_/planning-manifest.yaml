planning_version: 1
project: awin-ai-company
updated: 2026-09-05

canonical_organization:
  chairman:
    position: chairman
    identity: owner
  ceo:
    position: ceo
    identity: awin
  cio:
    position: cio
    identity: pick
  systems:
    uks:
      type: unified_knowledge_system
      managed_by_position: cio

invariants:
  - Position != Role != Identity != Agent != Runtime != System != Presentation
  - Mission is the preferred durable business/work unit beginning in Change 002
  - Runtime/provider changes must not redefine organizational identity or ownership
  - Planning history is append/supersede oriented; accepted decisions are not silently rewritten
  - OpenSpec changes must record planning provenance
  - Implementation findings return through controlled feedback, not arbitrary reverse edits
  - ChatGPT planning does not directly allocate or create OpenSpec Changes; Antigravity resolves ownership after repository inspection

canonical_roadmap:
  path: _myplan_/roadmap/2026-09-05_AI-Company-Orchestration_Integrated-Plan.md
  status: canonical

required_indexes:

  change_registry: _myplan_/change-registry.yaml
  agent_contract: AGENTS.md
  openspec_config: openspec/config.yaml

accepted_decisions:
  - path: _myplan_/decisions/2026-09-05_CIO-Identity-Renamed-to-Pick.md
    status: accepted
    effect: CIO current identity is Pick; UKS is a system, not an identity
  - path: _myplan_/decisions/2026-09-05_Awin-CEO-Executive-Presence_Planning-Boundary-and-Stack.md
    status: accepted
    effect: Awin digital human is an Executive Presence presentation layer; no OpenSpec Change ID is preassigned by ChatGPT planning

